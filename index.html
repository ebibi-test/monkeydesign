<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>商品防錯小幫手</title>
<style>
:root{
  --bg:#F5F5F6; --surface:#FFFFFF; --border:#E3E3E6; --border2:#EDEDEF;
  --text:#18181B; --sub:#6B6B74; --faint:#A2A2AA;
  --accent:#2C5B8C; --accent-soft:#EAF1F8;
  --ok:#2E7D46; --ok-soft:#E7F3EB; --warn:#B7791F; --warn-soft:#FCF3E3; --danger:#C0392B; --danger-soft:#FBEAE8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans TC",system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
a{color:var(--accent);text-decoration:none;cursor:pointer;}
.app{display:flex;height:100%;}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:220px;background:var(--surface);border-right:1px solid var(--border);transform:translateX(-100%);transition:transform .18s ease;z-index:20;padding-top:env(safe-area-inset-top,0px);overflow-y:auto;}
.sidebar.open{transform:translateX(0);}
.sidebar .brand{padding:18px 18px 14px;font-size:15px;font-weight:700;border-bottom:1px solid var(--border);}
.nav-group{padding:10px 8px;}
.nav-label{font-size:11px;color:var(--faint);padding:10px 10px 4px;}
.nav-item{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:6px;color:var(--sub);cursor:pointer;font-size:13.5px;}
.nav-item:hover{background:var(--border2);}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.nav-item .soon{font-size:10.5px;color:var(--faint);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:15;display:none;}
.overlay.show{display:block;}
.main{flex:1;min-width:0;}
.topbar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border);padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;display:flex;align-items:center;gap:12px;}
.menu-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);flex:0 0 auto;}
.crumb{font-size:12.5px;color:var(--faint);}
.crumb a{color:var(--faint);}
.page-title{font-size:16px;font-weight:700;margin:2px 0 0;}
.content{padding:16px;max-width:1000px;margin:0 auto;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;}
.month-filter{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.month-filter select{padding:8px 11px;border:1px solid var(--border);border-radius:6px;font-size:13.5px;font-family:inherit;background:var(--surface);color:var(--text);font-weight:600;}
.month-filter .mf-count{font-size:12px;color:var(--faint);}
.mf-arrow{width:26px;height:26px;line-height:1;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;font-family:inherit;}
.mf-arrow:hover:not(:disabled){background:var(--border2);}
.mf-arrow:disabled{color:var(--faint);cursor:not-allowed;opacity:.5;}
.mf-today{font-size:12.5px;color:var(--accent);cursor:pointer;margin-left:2px;}
.tab{padding:9px 4px;margin-right:16px;font-size:13.5px;color:var(--sub);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;}
.tab.active{color:var(--accent);border-color:var(--accent);font-weight:600;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;padding:9px 12px;font-size:11.5px;color:var(--faint);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:11px 12px;border-bottom:1px solid var(--border2);vertical-align:middle;white-space:nowrap;}
tbody tr{cursor:pointer;}
tbody tr:hover{background:var(--border2);}
tbody tr:last-child td{border-bottom:none;}
.tablewrap{overflow-x:auto;}
.status{display:inline-block;padding:3px 9px;border-radius:4px;font-size:11.5px;font-weight:600;}
.st-pending{background:var(--warn-soft);color:var(--warn);}
.st-progress{background:var(--accent-soft);color:var(--accent);}
.st-done{background:var(--ok-soft);color:var(--ok);}
.st-danger{background:var(--danger-soft);color:var(--danger);}
.empty{padding:44px 10px;text-align:center;color:var(--faint);font-size:13.5px;line-height:1.9;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn.secondary{background:var(--surface);color:var(--text);border-color:var(--border);}
.btn.danger{background:var(--danger);border-color:var(--danger);}
.btn.small{padding:6px 11px;font-size:12.5px;}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.search-input{flex:1;min-width:160px;max-width:320px;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;background:var(--surface);color:var(--text);}
.field-grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:520px){.field-grid.two{grid-template-columns:1fr 1fr;}}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;background:var(--surface);color:var(--text);}
.detail-block{padding:16px;}
.detail-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border2);font-size:13.5px;gap:10px;flex-wrap:wrap;}
.detail-row:last-child{border-bottom:none;}
.detail-row .k{color:var(--sub);flex:0 0 auto;}
.section-title{font-size:13px;font-weight:700;margin:20px 0 10px;}
.section-title:first-child{margin-top:0;}
.stage-list{display:flex;flex-direction:column;gap:8px;}
.stage-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px solid var(--border);border-radius:7px;cursor:pointer;background:var(--surface);}
.stage-row .name{font-size:13.5px;font-weight:600;}
.stage-row .sub{font-size:12px;color:var(--faint);margin-top:2px;}
.check-item{display:flex;gap:9px;padding:10px 2px;border-bottom:1px solid var(--border2);align-items:flex-start;}
.check-item input{margin-top:2px;width:17px;height:17px;accent-color:var(--accent);}
.check-item.locked{opacity:.55;}
.check-item .tag{font-size:10.5px;color:var(--faint);border:1px solid var(--border);border-radius:4px;padding:1px 6px;margin-right:4px;flex:0 0 auto;}
.inline-add{display:flex;gap:8px;margin-top:12px;}
.inline-add input{flex:1;padding:9px 10px;border:1px solid var(--border);border-radius:6px;font-size:13.5px;font-family:inherit;}
.lock-bar{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
.soon-box{background:var(--surface);border:1px dashed var(--border);border-radius:8px;padding:32px 20px;text-align:center;color:var(--sub);font-size:13.5px;line-height:1.9;}
.soon-box b{color:var(--text);}
.banner{padding:12px 14px;border-radius:7px;font-size:13.5px;font-weight:600;margin-bottom:14px;}
.banner.ok{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok);}
.banner.warn{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);}
.banner.danger{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger);}
.waiting-badge{display:inline-block;padding:3px 9px;border-radius:4px;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent);}
.case-header{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px;}
.case-header .title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.case-header .meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:12.5px;color:var(--sub);}
.product-block{margin-bottom:18px;}
.product-block h4{font-size:13px;margin:0 0 8px;color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.style-card{border:1px solid var(--border);border-radius:7px;padding:12px 14px;margin-bottom:8px;cursor:pointer;background:var(--surface);}
.style-card:hover{background:var(--border2);}
.style-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.style-name{font-weight:700;font-size:13.5px;}
.style-meta{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.6;}
.style-warn{margin-top:6px;font-size:12px;color:var(--danger);line-height:1.8;}
.dash-section{margin-bottom:22px;}
.dash-section .sec-title{font-size:13.5px;font-weight:700;margin-bottom:8px;}
.dash-section .count{font-size:11.5px;color:var(--faint);font-weight:400;}
.dash-row{display:flex;justify-content:space-between;align-items:flex-start;padding:11px 12px;border-bottom:1px solid var(--border2);cursor:pointer;gap:10px;flex-wrap:wrap;}
.dash-row:last-child{border-bottom:none;}
.dash-row:hover{background:var(--border2);}
.dash-left{font-size:12.5px;flex:1;min-width:200px;}
.dash-left .l1{font-weight:600;color:var(--text);}
.dash-left .l2{color:var(--sub);margin-top:3px;line-height:1.6;}
.dash-right{text-align:right;font-size:11.5px;color:var(--sub);white-space:nowrap;}
.err-item{padding:10px 12px;border-bottom:1px solid var(--border2);font-size:12.5px;}
.err-item:last-child{border-bottom:none;}
.err-item .d{color:var(--faint);font-size:11px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:none;}
.modal-overlay.show{display:block;}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:92%;max-width:460px;max-height:86vh;overflow-y:auto;background:var(--surface);border-radius:10px;z-index:31;display:none;box-shadow:0 14px 44px rgba(0,0,0,.3);}
.modal.show{display:block;}
.modal-header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border);font-size:15px;font-weight:700;position:sticky;top:0;background:var(--surface);border-radius:10px 10px 0 0;}
.modal-close{cursor:pointer;color:var(--faint);font-size:20px;line-height:1;padding:2px 5px;flex:0 0 auto;}
.modal-close:hover{color:var(--text);}
.modal-body{padding:16px 18px;}
.modal-body .field-grid{gap:14px;}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--surface);border-radius:0 0 10px 10px;}
.field textarea{resize:vertical;min-height:64px;font-family:inherit;}
.field-hint{font-size:11.5px;color:var(--faint);margin-top:5px;line-height:1.6;}
</style>
</head>
<body>
<div class="app">
  <div class="overlay" id="overlay" onclick="closeNav()"></div>
  <div class="sidebar" id="sidebar">
    <div class="brand">商品防錯小幫手</div>
    <div class="nav-group">
      <div class="nav-label">總覽</div>
      <div class="nav-item" data-r="home" onclick="nav('home')">工作台</div>
    </div>
    <div class="nav-group">
      <div class="nav-label">基礎資料</div>
      <div class="nav-item" data-r="products" onclick="nav('products')">商品管理</div>
      <div class="nav-item" data-r="packagings" onclick="nav('packagings')">包裝／底卡管理</div>
    </div>
    <div class="nav-group">
      <div class="nav-label">案件與生產</div>
      <div class="nav-item" data-r="orders" onclick="nav('orders')">案件管理</div>
      <div class="nav-item" data-r="errors" onclick="nav('errors')">錯誤紀錄</div>
      <div class="nav-item" data-r="shipping" onclick="nav('shipping')">出貨</div>
    </div>
    <div class="nav-group">
      <div class="nav-label">分析與系統</div>
      <div class="nav-item" data-r="stats" onclick="nav('stats')">統計<span class="soon">規劃中</span></div>
      <div class="nav-item" data-r="settings" onclick="nav('settings')">系統設定<span class="soon">規劃中</span></div>
      <div class="nav-item" onclick="exportData()">⬇ 匯出備份</div>
      <div class="nav-item" onclick="importData()">⬆ 匯入備份</div>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="menu-btn" onclick="openNav()">☰</div>
      <div style="flex:1;min-width:0"><div class="crumb" id="crumb"></div><div class="page-title" id="pageTitle">工作台</div></div>
      <div id="syncBadge" style="font-size:11px;color:var(--faint);white-space:nowrap;flex:0 0 auto;">連線中…</div>
      <button id="authBtn" class="btn small secondary" style="flex:0 0 auto;" onclick="handleAuthClick()">登入同步</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
<div class="modal" id="modal">
  <div class="modal-header"><span id="modalTitle"></span><span class="modal-close" onclick="closeModal()">✕</span></div>
  <div class="modal-body" id="modalBody"></div>
  <div class="modal-footer">
    <button class="btn secondary" onclick="closeModal()">取消</button>
    <button class="btn" id="modalSubmitBtn" onclick="submitModal()">確定</button>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script>
/* ================= 常數 ================= */
const KINDS = [
  {key:'test', label:'測試'},
  {key:'sample', label:'打樣'},
  {key:'preBulk', label:'大貨前樣'},
  {key:'bulk', label:'大貨'}
];
function kindLabel(k){ const f=KINDS.find(x=>x.key===k); return f?f.label:k; }
const WAITING = ['我方處理','設計','業務','主管','客戶','工廠','其他'];

/* ================= 工具函式 ================= */
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function monthStr(d){ d = d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(m){ if(!m) return '未分類'; const parts = m.split('-'); return parts[0]+'年'+parts[1]+'月'; }
function orderMonth(o){ return o.month || (o.dueDate ? o.dueDate.slice(0,7) : monthStr()); }
function monthFilterHtml(months, counts, current, totalCount, onChangeFn){
  let opts = `<option value="all" ${current==='all'?'selected':''}>全部月份（共 ${totalCount} 件）</option>`;
  const byYear = {};
  months.forEach(m=>{ const y=m.split('-')[0]; (byYear[y]=byYear[y]||[]).push(m); });
  const years = Object.keys(byYear).sort((a,b)=> b.localeCompare(a));
  years.forEach(y=>{
    opts += `<optgroup label="${y}年">`;
    byYear[y].forEach(m=> opts += `<option value="${m}" ${current===m?'selected':''}>${esc(monthLabel(m))}（${counts[m]} 件）</option>`);
    opts += `</optgroup>`;
  });
  // months is sorted newest-first; "older" = next index, "newer" = previous index
  const idx = months.indexOf(current);
  const olderVal = idx>=0 && idx<months.length-1 ? months[idx+1] : null;
  const newerVal = idx>0 ? months[idx-1] : null;
  const thisMonth = monthStr();
  const showTodayLink = current!==thisMonth && months.includes(thisMonth);
  return `<div class="month-filter">
    <span class="mf-count">月份：</span>
    <button type="button" class="mf-arrow" aria-label="上個月" ${olderVal? `onclick="${onChangeFn}('${olderVal}')"` : 'disabled'}>‹</button>
    <select onchange="${onChangeFn}(this.value)">${opts}</select>
    <button type="button" class="mf-arrow" aria-label="下個月" ${newerVal? `onclick="${onChangeFn}('${newerVal}')"` : 'disabled'}>›</button>
    ${showTodayLink? `<a class="mf-today" onclick="${onChangeFn}('${thisMonth}')">回到本月</a>` : ''}
  </div>`;
}
/* ---- 日期／時間格式化：內部一律以 ISO 格式儲存，顯示時才轉成人看的格式 ----
   （對照多數成熟網站的做法：GitHub / Gmail / Asana 等，資料庫存 ISO 8601，
   畫面上依情境顯示「10月20日」「還有3天」「已逾期5天」或完整時間戳，而不是直接印出原始字串） */
function nowISO(){ return new Date().toISOString(); }
function parseDateOnly(dateStr){
  // 只接受 YYYY-MM-DD；用年月日分別建構 Date，避免 new Date('YYYY-MM-DD') 被當成 UTC 午夜
  // 在部分時區（例如台灣 UTC+8）會顯示成前一天的問題
  if(!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return null;
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return isNaN(dt.getTime()) ? null : dt;
}
function daysBetween(fromStr, toStr){
  const a = parseDateOnly(fromStr), b = parseDateOnly(toStr);
  if(!a || !b) return null;
  return Math.round((b-a)/86400000);
}
function daysUntilDue(dateStr){ return dateStr ? daysBetween(todayStr(), dateStr) : null; }
// 一般日期顯示：同一年只顯示「月日」，跨年才加上年份（常見的中文網站慣例）
function formatDate(dateStr){
  const d = parseDateOnly(dateStr);
  if(!d) return dateStr ? esc(dateStr) : '-';
  const sameYear = d.getFullYear()===new Date().getFullYear();
  return sameYear ? `${d.getMonth()+1}月${d.getDate()}日` : `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
// 交期顯示：日期本身 + 相對天數提示（逾期／今天到期／即將到期），比單純印 YYYY-MM-DD 更直覺好懂
function formatDueDate(dateStr){
  if(!dateStr) return '-';
  const days = daysUntilDue(dateStr); const base = formatDate(dateStr);
  if(days===null) return base;
  if(days<0) return `${base} <span style="color:var(--danger);font-weight:600">（已逾期${-days}天）</span>`;
  if(days===0) return `${base} <span style="color:var(--warn);font-weight:600">（今天到期）</span>`;
  if(days<=3) return `${base} <span style="color:var(--warn)">（還有${days}天）</span>`;
  return base;
}
// 完整時間戳顯示（例如鎖定時間）：解析 ISO 字串；若是舊資料的 toLocaleString 格式解析失敗，就照原樣顯示，維持向下相容
function formatDateTime(dtStr){
  if(!dtStr) return '-';
  const d = new Date(dtStr);
  if(isNaN(d.getTime())) return esc(dtStr);
  const pad = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function reqTag(required){ return `<span class="tag" style="color:${required?'var(--danger)':'var(--faint)'}">${required?'🔴 必須':'🟡 建議'}</span>`; }
function catalogOfId(id){ return products.find(p=>p.id===id); }
function pkgOfId(id){ return packagings.find(p=>p.id===id); }
function findOrder(oid){ return orders.find(o=>o.id===oid); }
function findCaseProduct(o,cpid){ return o ? o.products.find(cp=>cp.id===cpid) : null; }
function findStyle(cp,sid){ return cp ? cp.styles.find(s=>s.id===sid) : null; }
function getStyle(oid,cpid,sid){ const o=findOrder(oid); const cp=findCaseProduct(o,cpid); return findStyle(cp,sid); }
function dueOf(s,o){ if(s.dueDate) return s.dueDate; if(o) return o.dueDate; const oo=orders.find(x=>x.products.some(cp=>cp.styles.includes(s))); return oo?oo.dueDate:''; }
function keepFocus(){ const i=document.querySelector('.search-input'); if(i){ i.focus(); const n=i.value.length; i.setSelectionRange(n,n);} }

/* ================= 表單彈窗（取代陽春的 prompt()） ================= */
let modalSubmitHandler = null;
function openModalRaw(title, bodyHtml, submitLabel, onSubmit){
  modalSubmitHandler = onSubmit;
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalSubmitBtn').textContent = submitLabel || '確定';
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('modal').classList.add('show');
  setTimeout(()=>{ const first = document.querySelector('#modalBody input, #modalBody select, #modalBody textarea'); if(first) first.focus(); }, 30);
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
  document.getElementById('modal').classList.remove('show');
  modalSubmitHandler = null;
}
function submitModal(){ if(modalSubmitHandler) modalSubmitHandler(); }
document.addEventListener('keydown', function(e){
  if(!document.getElementById('modal').classList.contains('show')) return;
  if(e.key==='Escape'){ closeModal(); return; }
  if(e.key==='Enter' && (e.target.tagName||'').toLowerCase()==='input'){ e.preventDefault(); submitModal(); }
});
function mfField(f){
  const val = (f.value===undefined||f.value===null) ? '' : f.value;
  let inner;
  if(f.type==='select'){
    inner = `<select id="mf_${f.key}">` + f.options.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(val)?'selected':''}>${esc(o.label)}</option>`).join('') + `</select>`;
  } else if(f.type==='textarea'){
    inner = `<textarea id="mf_${f.key}" rows="${f.rows||3}" placeholder="${esc(f.placeholder||'')}">${esc(val)}</textarea>`;
  } else {
    const listAttr = f.historyKey ? ` list="dl_${f.historyKey}"` : '';
    inner = `<input type="${f.type||'text'}" id="mf_${f.key}" value="${esc(val)}" placeholder="${esc(f.placeholder||'')}"${listAttr}>`;
    if(f.historyKey) inner += historyDatalist(f.historyKey);
  }
  return `<div class="field"><label>${esc(f.label)}${f.required?' <span style="color:var(--danger)">*</span>':''}</label>${inner}${f.hint?`<div class="field-hint">${esc(f.hint)}</div>`:''}</div>`;
}
function openForm(title, fields, onSubmit, submitLabel){
  const body = '<div class="field-grid">' + fields.map(mfField).join('') + '</div>';
  openModalRaw(title, body, submitLabel, ()=>{
    const values = {};
    for(const f of fields){
      const el = document.getElementById('mf_'+f.key);
      let v = el.value;
      if(f.required && !String(v||'').trim()){ alert(f.label+' 為必填'); el.focus(); return; }
      values[f.key] = typeof v==='string' ? v.trim() : v;
    }
    closeModal();
    for(const f of fields){ if(f.historyKey) recordFieldHistory(f.historyKey, values[f.key]); }
    onSubmit(values);
  });
}

/* ================= 欄位自動建議（記住之前填過的內容） ================= */
let fieldHistory = {};
function recordFieldHistory(key, value){
  value = (value||'').toString().trim(); if(!value) return;
  if(!fieldHistory[key]) fieldHistory[key] = [];
  fieldHistory[key] = fieldHistory[key].filter(v=>v!==value);
  fieldHistory[key].unshift(value);
  if(fieldHistory[key].length>30) fieldHistory[key] = fieldHistory[key].slice(0,30);
}
function historyDatalist(key){
  return `<datalist id="dl_${key}">` + (fieldHistory[key]||[]).map(v=>`<option value="${esc(v)}">`).join('') + `</datalist>`;
}
function historyInputField(label, id, historyKey, opts){
  opts = opts || {};
  return `<div class="field"><label>${esc(label)}${opts.required?' <span style="color:var(--danger)">*</span>':''}</label>
    <input type="text" id="${id}" list="dl_${historyKey}" placeholder="${esc(opts.placeholder||'')}" value="${esc(opts.value||'')}">
    ${historyDatalist(historyKey)}
  </div>`;
}

/* ================= 商品 / 包裝 資料存取（含知識庫：固定檢查點＋錯誤紀錄） ================= */
function ensureProduct(s){
  if(!s.product) s.product = {test:[], sample:[], preBulk:[], bulk:[]};
  return s.product;
}
function roundItemsFromCatalog(product, kindKey){
  if(!product) return [];
  return product.checkpoints.filter(c=>c.stage===kindKey||c.stage==='all').map(c=>({cpId:c.id,text:c.text,required:!!c.required,checked:false}));
}
function ensurePackagingCheck(s){
  if(s.packagingId && !s.packagingCheck){
    const pkg = pkgOfId(s.packagingId);
    s.packagingCheck = {items:(pkg?pkg.checkpoints.map(c=>({cpId:c.id,text:c.text,required:!!c.required,checked:false})):[]), note:'', status:'progress', lockedAt:null};
  }
  return s.packagingCheck;
}
function productErrorCount(pid){ return errors.filter(e=>e.kind==='product'&&e.refId===pid).length; }
function packagingErrorCount(pid){ return errors.filter(e=>e.kind==='packaging'&&e.refId===pid).length; }
function productErrors(pid){ return errors.filter(e=>e.kind==='product'&&e.refId===pid).slice().reverse(); }
function packagingErrors(pid){ return errors.filter(e=>e.kind==='packaging'&&e.refId===pid).slice().reverse(); }

/* ================= 款式整體狀態 ================= */
function productProgress(s){
  const p = ensureProduct(s);
  for(let i=KINDS.length-1;i>=0;i--){
    const k = KINDS[i]; const arr = p[k.key];
    if(arr.length){ const last = arr[arr.length-1]; return {kind:k.key, label:k.label, done:last.status==='done', roundNo:arr.length}; }
  }
  return {kind:null, label:'尚未開始', done:false, roundNo:0};
}
function styleOverallLabel(s, o){
  const due = dueOf(s,o); const overdue = due && daysUntilDue(due) < 0;
  const prog = productProgress(s);
  let label = prog.kind ? (prog.done ? prog.label+'已完成' : prog.label+'中') : '尚未開始';
  let cls = !prog.kind ? 'st-pending' : (prog.done && prog.kind==='bulk' ? 'st-done' : 'st-progress');
  if(overdue){ label='已逾期'; cls='st-danger'; }
  return {label, cls};
}
function styleErrorWarnings(s, cp){
  const reasons = [];
  if(cp && cp.productId){ const n = productErrorCount(cp.productId); if(n) reasons.push('🔴 此商品過去發生過 '+n+' 次錯誤'); }
  if(s.packagingId){ const n = packagingErrorCount(s.packagingId); if(n) reasons.push('🔴 此包裝過去發生過 '+n+' 次錯誤'); }
  return reasons;
}
function styleProgressWarnings(s){
  const reasons = []; const p = ensureProduct(s);
  KINDS.forEach(k=>{ p[k.key].forEach((r,idx)=>{ if(r.status!=='done'){ const m=r.items.filter(i=>i.required&&!i.checked).length; if(m) reasons.push('⚠ '+k.label+'第'+(idx+1)+'輪尚有 '+m+' 項必要檢查未完成'); } }); });
  if(s.packagingCheck && s.packagingCheck.status!=='done'){ const m=s.packagingCheck.items.filter(i=>i.required&&!i.checked).length; if(m) reasons.push('⚠ 包裝檢查尚有 '+m+' 項未完成'); }
  if(!s.packagingId) reasons.push('・尚未選擇包裝／底卡');
  return reasons;
}
function styleAllWarnings(s, cp){ return styleErrorWarnings(s,cp).concat(styleProgressWarnings(s)); }
function orderOverallStatus(o){
  let hasDanger=false, notAllDone=false, any=false;
  o.products.forEach(cp=>cp.styles.forEach(s=>{
    any = true;
    const st = styleOverallLabel(s,o);
    if(st.cls==='st-danger') hasDanger=true;
    if(st.cls!=='st-done') notAllDone=true;
  }));
  if(!any) return {label:'尚未加入商品', cls:'st-pending'};
  if(!notAllDone) return {label:'已完成', cls:'st-done'};
  if(hasDanger) return {label:'需留意', cls:'st-danger'};
  return {label:'進行中', cls:'st-progress'};
}
function styleCountLabel(o){ let total=0; o.products.forEach(cp=> total += cp.styles.length); return o.products.length+' 商品 / '+total+' 款式'; }
function allStyleEntries(){
  const out=[]; orders.forEach(o=> o.products.forEach(cp=> cp.styles.forEach(s=> out.push({order:o, cp, style:s}))) ); return out;
}

function setSyncBadge(status){
  const el = document.getElementById('syncBadge'); if(!el) return;
  const map = {
    connecting: ['連線中…','var(--faint)'],
    synced:     ['☁ 已同步','var(--ok)'],
    saving:     ['☁ 儲存中…','var(--accent)'],
    localonly:  ['⚠ 僅本機（未登入）','var(--warn)'],
    error:      ['⚠ 同步失敗，已存本機','var(--danger)']
  };
  const m = map[status]||map.connecting;
  el.textContent = m[0]; el.style.color = m[1];
}
function updateAuthUI(){
  const btn = document.getElementById('authBtn'); if(!btn) return;
  btn.textContent = fbUser ? ('登出（'+(fbUser.displayName||fbUser.email||'已登入')+'）') : '登入同步';

function signInGoogle(){
  const provider = new firebase.auth.GoogleAuthProvider();
  fbAuth.signInWithPopup(provider).catch(e=>{ alert('登入失敗：'+e.message); });
}
fbAuth.onAuthStateChanged(async (user)=>{
  fbUser = user; updateAuthUI();
  if(!user){ fbDocRef = null; setSyncBadge('localonly'); return; }
  fbDocRef = fbStore.collection('users').doc(user.uid).collection('appstate').doc('main');
  setSyncBadge('connecting');
  try{
    const snap = await fbDocRef.get();
    if(snap.exists){
      const data = snap.data();
      if(data && Array.isArray(data.products) && Array.isArray(data.orders)){
        products=data.products; packagings=data.packagings||[]; orders=data.orders; errors=data.errors||[]; seq=data.seq||100;
        fieldHistory=data.fieldHistory||{};
      }
    } else {
      await fbDocRef.set({products, packagings, orders, errors, seq, fieldHistory, updatedAt:new Date().toISOString()});
    }
    setSyncBadge('synced');
    render();
  }catch(e){ setSyncBadge('error'); }
});
function saveState(){
  try{ localStorage.setItem('erp_smart_v2', JSON.stringify({products, packagings, orders, errors, seq, fieldHistory})); }catch(e){}
  scheduleCloudSave();
}
function scheduleCloudSave(){
  if(!fbDocRef) return;
  clearTimeout(dbSaveTimer);
  setSyncBadge('saving');
  dbSaveTimer = setTimeout(async ()=>{
    try{
      await fbDocRef.set({products, packagings, orders, errors, seq, fieldHistory, updatedAt: new Date().toISOString()});
      setSyncBadge('synced');
    }catch(e){ setSyncBadge('error'); }
  }, 700);
}
function loadState(){
  try{
    const raw = localStorage.getItem('erp_smart_v2'); if(!raw) return false;
    const data = JSON.parse(raw);
    if(!data || !Array.isArray(data.products) || !Array.isArray(data.orders)) return false;
    products = data.products; packagings = data.packagings||[]; orders = data.orders; errors = data.errors||[]; seq = data.seq||100;
    fieldHistory = data.fieldHistory || {};
    return true;
  }catch(e){ return false; }
}

let homeMonthFilter = 'all';
function setHomeMonthFilter(v){ homeMonthFilter = v; render(); }
function viewHome(){
  const allEntries = allStyleEntries();
  if(allEntries.length===0) return '<div class="panel"><div class="empty">目前沒有案件，請先到「案件管理」新增</div></div>';
  const monthCounts = {};
  allEntries.forEach(e=>{ const m = orderMonth(e.order); monthCounts[m] = (monthCounts[m]||0)+1; });
  const months = Object.keys(monthCounts).sort((a,b)=> b.localeCompare(a));
  if(!months.includes(homeMonthFilter)) homeMonthFilter = 'all';
  const entries = homeMonthFilter==='all' ? allEntries : allEntries.filter(e=> orderMonth(e.order)===homeMonthFilter);
  let html = monthFilterHtml(months, monthCounts, homeMonthFilter, allEntries.length, 'setHomeMonthFilter');
  const risky = entries.map(e=>({...e, warnLine: styleErrorWarnings(e.style, e.cp).join('、')})).filter(x=>x.warnLine);
  const overdue = entries.filter(e=>{ const due=dueOf(e.style,e.order); return due && daysUntilDue(due)<0; });
  const upcoming = entries.filter(e=>{ const due=dueOf(e.style,e.order); if(!due) return false; const days=daysUntilDue(due); return days>=0 && days<=3; });
  const mine = entries.filter(e=>e.style.waitingOn==='我方處理');
  const waitCustomer = entries.filter(e=>e.style.waitingOn==='客戶');
  const waitDesign = entries.filter(e=>e.style.waitingOn==='設計');
  const waitFactory = entries.filter(e=>e.style.waitingOn==='工廠');
  const others = entries.filter(e=>['業務','主管','其他'].includes(e.style.waitingOn));
  let sectionsHtml='';
  sectionsHtml += dashSection('⚠ 今天最容易出錯', risky);
  sectionsHtml += dashSection('🔴 已逾期', overdue);
  sectionsHtml += dashSection('🟡 即將到期（3天內）', upcoming);
  sectionsHtml += dashSection('📌 今天需要我處理', mine);
  sectionsHtml += dashSection('👤 等待客戶', waitCustomer);
  sectionsHtml += dashSection('🎨 等待設計', waitDesign);
  sectionsHtml += dashSection('🏭 等待工廠', waitFactory);
  if(others.length) sectionsHtml += dashSection('⏳ 其他等待中', others);
  if(!sectionsHtml) sectionsHtml = '<div class="panel"><div class="empty">這個月份沒有需要留意的案件</div></div>';
  return html + sectionsHtml;
}
function dashSection(title, list){
  if(!list || list.length===0) return '';
  let html = `<div class="dash-section"><div class="sec-title">${title} <span class="count">${list.length} 件</span></div><div class="panel">`;
  list.forEach(e=>{
    const s = styleOverallLabel(e.style, e.order);
    const warnLine = e.warnLine!==undefined ? e.warnLine : styleAllWarnings(e.style, e.cp).join('、');

let orderSearch = '';

function viewOrders(){
  let html = `<div class="toolbar">
    <input type="text" class="search-input" placeholder="搜尋案件編號／名稱／客戶／負責人" value="${esc(orderSearch)}" oninput="orderSearch=this.value;render();keepFocus()">
    <button class="btn" onclick="newOrder()">＋ 新增案件</button></div>`;
  const q = orderSearch.trim().toLowerCase();
  const rows = q ? orders.filter(o=>[o.no,o.name,o.customerName,o.owner].some(v=>(v||'').toLowerCase().includes(q))) : orders;
  if(rows.length===0){ html += '<div class="panel"><div class="empty">目前沒有符合條件的案件</div></div>'; return html; }
  const groups = {};
  rows.forEach(o=>{ const m = orderMonth(o); (groups[m] = groups[m]||[]).push(o); });
  const months = Object.keys(groups).sort((a,b)=> b.localeCompare(a));
  if(!months.includes(orderMonthFilter)) orderMonthFilter = 'all';
  const counts = {}; months.forEach(m=> counts[m]=groups[m].length);
  html += monthFilterHtml(months, counts, orderMonthFilter, rows.length, 'setOrderMonthFilter');
  const showMonths = orderMonthFilter==='all' ? months : [orderMonthFilter];
  showMonths.forEach(m=>{
    html += `<div class="dash-section"><div class="sec-title">${esc(monthLabel(m))} <span class="count">${groups[m].length} 件</span></div>

  </div>`;
  if(tab==='product'){
    const hist = productErrors(cp.productId);
    if(hist.length) html += `<div class="banner warn">⚠ 此商品過去發生過的問題：<br>${hist.map(e=>'・'+formatDate(e.date)+'（'+kindLabel(e.stage||'')+'）'+esc(e.content)).join('<br>')}</div>`;
    const p = ensureProduct(s);
    KINDS.forEach(k=>{
      html += `<div class="product-block"><h4>${k.label} <button class="btn small secondary" onclick="addRound('${oid}','${cpid}','${sid}','${k.key}')">＋ 新增一輪${k.label}</button></h4>`;
      const arr = p[k.key];
      if(!arr.length) html += '<div class="panel"><div class="empty">尚未開始</div></div>';
      else {
        html += '<div class="stage-list">';
        arr.forEach((r,idx)=>{
          const done = r.items.filter(i=>i.checked).length;
          const label = r.status==='done' ? '🔒 已鎖定' : '進行中';
          html += `<div class="stage-row" onclick="nav('round',{oid:'${oid}',cpid:'${cpid}',sid:'${sid}',kind:'${k.key}',idx:${idx}})">

            <div class="status ${r.status==='done'?'st-done':'st-progress'}">${label}</div></div>`;
        });
        html += '</div>';
      }
      html += '</div>';
    });
  } else if(tab==='packaging'){
    const pkg = s.packagingId ? pkgOfId(s.packagingId) : null;
    html += `<div class="toolbar"><div style="font-size:13.5px">目前包裝／底卡：<b>${pkg?esc(pkg.name):'尚未選擇'}</b></div><button class="btn small secondary" onclick="changeStylePackaging('${oid}','${cpid}','${sid}')">${pkg?'更換':'選擇'}包裝／底卡</button></div>`;
    if(!pkg){ html += '<div class="panel"><div class="empty">此款式尚未指定包裝／底卡</div></div>'; return html; }
    const hist = packagingErrors(pkg.id);
    if(hist.length) html += `<div class="banner warn">⚠ 此包裝過去發生過的問題：<br>${hist.map(e=>'・'+formatDate(e.date)+' '+esc(e.content)).join('<br>')}</div>`;
    const pc = s.packagingCheck;
    html += '<div class="section-title">製作時需要注意的點</div><div class="panel detail-block">';

      <div class="detail-row"><div class="k">商品</div><div>${esc(cp.name)}</div></div>

/* ================= 單一輪次頁面（測試／打樣／大貨前樣／大貨） ================= */
function addRound(oid,cpid,sid,kind){
  const cp = findCaseProduct(findOrder(oid),cpid); const product = catalogOfId(cp.productId);
  const items = roundItemsFromCatalog(product, kind);
  if(items.length===0 && !confirm('此商品目前沒有「'+kindLabel(kind)+'」的固定檢查點，仍要新增這一輪嗎？')) return;
  const s = getStyle(oid,cpid,sid);
  ensureProduct(s)[kind].push({items, note:'', status:'progress', lockedAt:null, createdAt:nowISO()});
  nav('round',{oid,cpid,sid,kind,idx:ensureProduct(s)[kind].length-1});
}
function viewRound(oid,cpid,sid,kind,idx){
  const s = getStyle(oid,cpid,sid); if(!s) return '<div class="empty">找不到款式</div>';
  const cp = findCaseProduct(findOrder(oid),cpid); const product = catalogOfId(cp.productId);
  const r = ensureProduct(s)[kind][idx]; if(!r) return '<div class="empty">找不到這一輪紀錄</div>';
  const hist = productErrors(cp.productId);
  let html = '';
  if(hist.length) html += `<div class="banner warn">⚠ 此商品過去發生過的問題：<br>${hist.map(e=>'・'+formatDate(e.date)+'（'+kindLabel(e.stage||'')+'）'+esc(e.content)).join('<br>')}</div>`;
  html += `<div class="section-title">${kindLabel(kind)} 第${idx+1}輪 · 檢查清單</div><div class="panel detail-block">`;
  if(r.items.length===0) html += '<div class="empty">尚未設定注意事項，請在下方新增</div>';
  r.items.forEach((it,i)=>{
    html += `<label class="check-item ${r.status==='done'?'locked':''}">
      <input type="checkbox" ${it.checked?'checked':''} ${r.status==='done'?'disabled':''} onchange="toggleRoundItem('${oid}','${cpid}','${sid}','${kind}',${idx},${i},this.checked)">
      <span>${reqTag(it.required)}${esc(it.text)}</span>
      ${r.status!=='done'?`<button type="button" class="btn small secondary" style="margin-left:auto" onclick="event.preventDefault();event.stopPropagation();editRoundItem('${oid}','${cpid}','${sid}','${kind}',${idx},${i})">編輯</button>
      <button type="button" class="btn small secondary" onclick="event.preventDefault();event.stopPropagation();deleteRoundItem('${oid}','${cpid}','${sid}','${kind}',${idx},${i})">刪除</button>`:''}</label>`;
  });
  html += '</div>';
  const missing = r.items.filter(i=>i.required&&!i.checked).length;
  if(missing>0 && r.status!=='done') html += `<div class="banner danger" style="margin-top:14px">尚有 ${missing} 項必要檢查未完成</div>`;
  if(r.status!=='done'){
    html += `<div class="field-grid two" style="margin-top:12px">
      <div class="field"><label>新增檢查重點</label><input type="text" id="newCpText" placeholder="例如：確認噴頭已預熱"></div>
      <div class="field"><label style="visibility:hidden">.</label><label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub);padding-top:10px"><input type="checkbox" id="newCpRequired" checked style="width:15px;height:15px"> 必須確認</label></div>
    </div>
    <div class="lock-bar">
      <button class="btn small secondary" onclick="addRoundCheckpoint('${oid}','${cpid}','${sid}','${kind}',${idx})">新增</button>
      <button class="btn small secondary" onclick="syncRound('${oid}','${cpid}','${sid}','${kind}',${idx})">同步最新固定提醒</button>
      <button class="btn small secondary" onclick="setRoundNote('${oid}','${cpid}','${sid}','${kind}',${idx})">備註</button>
      <button class="btn small secondary" onclick="addRoundError('${oid}','${cpid}','${sid}','${kind}',${idx})">記錄這次發生的問題</button>
      <button class="btn danger small" onclick="deleteRound('${oid}','${cpid}','${sid}','${kind}',${idx})">刪除這一輪</button>
    </div>
    <div class="lock-bar"><button class="btn small" onclick="lockRound('${oid}','${cpid}','${sid}','${kind}',${idx})">🔒 完成並鎖定這一輪</button></div>`;
  } else {
    html += `<div class="banner ok" style="margin-top:14px">🔒 已於 ${formatDateTime(r.lockedAt)} 鎖定</div><div class="lock-bar"><button class="btn secondary small" onclick="reopenRound('${oid}','${cpid}','${sid}','${kind}',${idx})">解除鎖定</button><button class="btn danger small" onclick="deleteRound('${oid}','${cpid}','${sid}','${kind}',${idx})">刪除這一輪</button></div>`;
  }
  return html;
}
function toggleRoundItem(oid,cpid,sid,kind,idx,itemIdx,val){ const s=getStyle(oid,cpid,sid); ensureProduct(s)[kind][idx].items[itemIdx].checked=val; render(); }
function editRoundItem(oid,cpid,sid,kind,idx,itemIdx){
  const s=getStyle(oid,cpid,sid); const r=s && ensureProduct(s)[kind][idx]; const it=r && r.items[itemIdx]; if(!it) return;
  openForm('編輯檢查項目', [
    {key:'text', label:'檢查內容', required:true, value:it.text}
  ], (v)=>{ it.text = v.text; render(); }, '儲存');
}
function deleteRoundItem(oid,cpid,sid,kind,idx,itemIdx){
  if(!confirm('確定刪除這個檢查項目？')) return;
  const s=getStyle(oid,cpid,sid); const r=s && ensureProduct(s)[kind][idx]; if(!r || r.status==='done') return;
  r.items.splice(itemIdx,1); render();
}
function lockRound(oid,cpid,sid,kind,idx){
  const s=getStyle(oid,cpid,sid); const r=ensureProduct(s)[kind][idx];
  const missing = r.items.filter(i=>i.required&&!i.checked).length;
  if(missing){ if(!confirm('尚有 '+missing+' 項必要檢查未勾選，確定要鎖定嗎？')) return; }
  else if(!confirm('確定鎖定這一輪？')) return;
  r.status='done'; r.lockedAt=nowISO(); render();
}
function reopenRound(oid,cpid,sid,kind,idx){ if(!confirm('確定解除鎖定？')) return; const s=getStyle(oid,cpid,sid); const r=ensureProduct(s)[kind][idx]; r.status='progress'; r.lockedAt=null; render(); }
function deleteRound(oid,cpid,sid,kind,idx){ if(!confirm('確定刪除這一輪紀錄？無法復原')) return; const s=getStyle(oid,cpid,sid); ensureProduct(s)[kind].splice(idx,1); nav('style-detail',{oid,cpid,sid,tab:'product'}); }
function setRoundNote(oid,cpid,sid,kind,idx){
  const s=getStyle(oid,cpid,sid); const r=ensureProduct(s)[kind][idx];
  openForm('這一輪的備註', [{key:'note', label:'備註', type:'textarea', value:r.note}], (v)=>{ r.note=v.note; render(); }, '儲存');
}
function addRoundCheckpoint(oid,cpid,sid,kind,idx){
  const text = (document.getElementById('newCpText').value||'').trim(); if(!text) return;
  const required = document.getElementById('newCpRequired').checked;
  const s = getStyle(oid,cpid,sid); const r = ensureProduct(s)[kind][idx];
  const item = {cpId:null, text, required, checked:false}; r.items.push(item);
  const cp = findCaseProduct(findOrder(oid),cpid); const product = catalogOfId(cp.productId);
  if(product && confirm('要把這項也加入商品固定提醒，之後每次「'+kindLabel(kind)+'」都自動出現嗎？')){
    const c = {id:'c'+(seq++), stage:kind, text, required}; product.checkpoints.push(c); item.cpId = c.id;
  }
  render();
}
function syncRound(oid,cpid,sid,kind,idx){
  const s=getStyle(oid,cpid,sid); const r=ensureProduct(s)[kind][idx];
  const cp=findCaseProduct(findOrder(oid),cpid); const product=catalogOfId(cp.productId); if(!product) return;
  let n=0; roundItemsFromCatalog(product,kind).forEach(it=>{ if(!r.items.some(x=>x.text===it.text)){ r.items.push(it); n++; } });
  alert(n?'已補上 '+n+' 項':'沒有需要補的項目'); render();
}
function addRoundError(oid,cpid,sid,kind,idx){
  const cp = findCaseProduct(findOrder(oid),cpid); const product = catalogOfId(cp.productId);
  openForm('記錄這次發生的問題', [
    {key:'content', label:'這次發生了什麼問題？', type:'textarea', required:true},
    {key:'fix', label:'之後要怎麼避免？（會用來當作固定提醒的文字）', type:'textarea'}
  ], (v)=>{
    const fix = v.fix || ('確認：'+v.content);
    errors.push({id:'e'+(seq++), date:todayStr(), kind:'product', refId:product?product.id:null, stage:kind, content:v.content, fix});
    if(product && confirm('要把「'+fix+'」加入商品固定提醒，避免下次「'+kindLabel(kind)+'」再發生嗎？')){
      product.checkpoints.push({id:'c'+(seq++), stage:kind, text:fix, required:true});
    }
    render();
  }, '記錄');
}

/* ================= 包裝製作檢查 ================= */
function togglePackagingItem(oid,cpid,sid,idx,val){ const s=getStyle(oid,cpid,sid); s.packagingCheck.items[idx].checked=val; render(); }
function editPackagingItem(oid,cpid,sid,idx){
  const s=getStyle(oid,cpid,sid); const it=s && s.packagingCheck && s.packagingCheck.items[idx]; if(!it) return;
  openForm('編輯注意事項', [{key:'text', label:'內容', required:true, value:it.text}], (v)=>{ it.text = v.text; render(); }, '儲存');
}
function deletePackagingItem(oid,cpid,sid,idx){
  if(!confirm('確定刪除這個檢查項目？')) return;
  const s=getStyle(oid,cpid,sid); if(!s || !s.packagingCheck || s.packagingCheck.status==='done') return;
  s.packagingCheck.items.splice(idx,1); render();
}
function lockPackagingCheck(oid,cpid,sid){
  const s=getStyle(oid,cpid,sid); const pc=s.packagingCheck;
  const missing = pc.items.filter(i=>i.required&&!i.checked).length;
  if(missing){ if(!confirm('尚有 '+missing+' 項必要檢查未勾選，確定要鎖定嗎？')) return; }
  else if(!confirm('確定鎖定？')) return;
  pc.status='done'; pc.lockedAt=nowISO(); render();
}
function reopenPackagingCheck(oid,cpid,sid){ if(!confirm('確定解除鎖定？')) return; const s=getStyle(oid,cpid,sid); s.packagingCheck.status='progress'; s.packagingCheck.lockedAt=null; render(); }
function addPackagingCheckpoint(oid,cpid,sid){
  const text=(document.getElementById('newPkText').value||'').trim(); if(!text) return;
  const required=document.getElementById('newPkRequired').checked;
  const s=getStyle(oid,cpid,sid); const item={cpId:null,text,required,checked:false}; s.packagingCheck.items.push(item);
  const pkg = pkgOfId(s.packagingId);
  if(pkg && confirm('要把這項也加入包裝固定提醒，之後每次都自動出現嗎？')){
    const c={id:'k'+(seq++), text, required}; pkg.checkpoints.push(c); item.cpId=c.id;
  }
  render();
}
function syncPackagingCheck(oid,cpid,sid){
  const s=getStyle(oid,cpid,sid); const pkg=pkgOfId(s.packagingId); if(!pkg) return;
  let n=0; pkg.checkpoints.forEach(c=>{ if(!s.packagingCheck.items.some(x=>x.text===c.text)){ s.packagingCheck.items.push({cpId:c.id,text:c.text,required:c.required,checked:false}); n++; } });
  alert(n?'已補上 '+n+' 項':'沒有需要補的項目'); render();
}
function addPackagingError(oid,cpid,sid){
  const s=getStyle(oid,cpid,sid); const pkg=pkgOfId(s.packagingId);
  openForm('記錄這次發生的問題', [
    {key:'content', label:'這次發生了什麼問題？', type:'textarea', required:true},
    {key:'fix', label:'之後要怎麼避免？（會用來當作固定提醒的文字）', type:'textarea'}
  ], (v)=>{
    const fix = v.fix || ('確認：'+v.content);
    errors.push({id:'e'+(seq++), date:todayStr(), kind:'packaging', refId:pkg?pkg.id:null, stage:'', content:v.content, fix});
    if(pkg && confirm('要把「'+fix+'」加入包裝固定提醒，避免下次再發生嗎？')){
      pkg.checkpoints.push({id:'k'+(seq++), text:fix, required:true});
    }
    render();
  }, '記錄');
}

    const hist = productErrors(id);
    if(hist.length===0) html += '<div class="panel"><div class="empty">目前沒有錯誤紀錄</div></div>';
    else { html += '<div class="panel">'; hist.forEach(e=> html += `<div class="err-item"><div class="d">${formatDate(e.date)}・${kindLabel(e.stage||'')}</div>${esc(e.content)}${e.fix?'<br>對策：'+esc(e.fix):''}</div>`); html += '</div>'; }
  } else if(tab==='orders'){
    const rows = []; orders.forEach(o=> o.products.filter(cp=>cp.productId===id).forEach(cp=> cp.styles.forEach(s=> rows.push({o,cp,s}))));
    if(rows.length===0) html += '<div class="panel"><div class="empty">目前沒有案件使用此商品</div></div>';
    else {
      html += '<div class="panel"><div class="tablewrap"><table><thead><tr><th>案件編號</th><th>客戶</th><th>案件名稱</th><th>款式</th><th>目前進度</th></tr></thead><tbody>';
      rows.forEach(r=>{
        const prog = productProgress(r.s);
        html += `<tr onclick="nav('style-detail',{oid:'${r.o.id}',cpid:'${r.cp.id}',sid:'${r.s.id}',tab:'info'})">
          <td>${esc(r.o.no)}</td><td>${esc(r.o.customerName||'-')}</td><td>${esc(r.o.name)}</td><td>${esc(r.s.name)}</td><td>${esc(prog.label)}</td></tr>`;
      });
      html += '</tbody></table></div></div>';
    }
  } else {
    html += `<div class="panel detail-block">
      <div class="detail-row"><div class="k">商品編號</div><div>${esc(p.no)}</div></div>
      <div class="detail-row"><div class="k">商品名稱</div><div>${esc(p.name)}</div></div>
      <div class="detail-row"><div class="k">類型</div><div>${esc(p.type||'-')}</div></div>
      <div class="detail-row"><div class="k">固定檢查點數</div><div>${p.checkpoints.length}</div></div>
      <div class="detail-row"><div class="k">過去錯誤次數</div><div>${productErrorCount(p.id)}</div></div>
    </div>
    <div style="margin-top:14px;display:flex;gap:10px">
      <button class="btn small secondary" onclick="editProduct('${id}')">編輯商品資料</button>
      <button class="btn small secondary" onclick="deleteProduct('${id}')">刪除此商品</button>
    </div>`;
  }
  return html;
}
function editProduct(id){
  const p = products.find(x=>x.id===id); if(!p) return;
  openForm('編輯商品', [
    {key:'name', label:'商品名稱', required:true, value:p.name},
    {key:'type', label:'商品類型（選填）', historyKey:'productType', value:p.type}
  ], (v)=>{
    p.name = v.name; p.type = v.type; render();
  }, '儲存');
}
function deleteProduct(id){
  const p = products.find(x=>x.id===id); if(!p) return;
  const usedCount = orders.reduce((n,o)=> n + o.products.filter(cp=>cp.productId===id).length, 0);
  const msg = usedCount>0
    ? ('確定刪除「'+p.name+'」嗎？目前有 '+usedCount+' 個案件商品使用這個商品，刪除後那些項目會變成「尚未指定商品」，需要重新選擇。')
    : ('確定刪除「'+p.name+'」嗎？此動作無法復原。');
  if(!confirm(msg)) return;
  orders.forEach(o=> o.products.forEach(cp=>{ if(cp.productId===id) cp.productId=null; }));
  products = products.filter(x=>x.id!==id);
  nav('products');
}
function addProductCheckpointCatalog(pid){
  const text=(document.getElementById('newCpText2').value||'').trim(); if(!text) return;
  const stage=document.getElementById('newCpStage2').value;
  const required=document.getElementById('newCpRequired2').checked;
  products.find(p=>p.id===pid).checkpoints.push({id:'c'+(seq++), stage, text, required});
  render();
}
function editProductCheckpoint(pid,cid){
  const p=products.find(x=>x.id===pid); const it=p && p.checkpoints.find(c=>c.id===cid); if(!it) return;
  openForm('編輯固定檢查點', [
    {key:'text', label:'檢查內容', required:true, value:it.text},
    {key:'stage', label:'出現階段', type:'select', options:KINDS.concat([{key:'all',label:'全部階段'}]).map(k=>({value:k.key,label:k.label})), value:it.stage}
  ], (v)=>{ it.text=v.text; it.stage=v.stage; render(); }, '儲存');
}
function deleteProductCheckpoint(pid,cid){ if(!confirm('確定刪除？')) return; const p=products.find(x=>x.id===pid); p.checkpoints=p.checkpoints.filter(c=>c.id!==cid); render(); }

/* ================= 包裝／底卡目錄 ================= */
let packagingSearch = '';
function viewPackagings(){
  let html = `<div class="toolbar">
    <input type="text" class="search-input" placeholder="搜尋包裝／底卡名稱" value="${esc(packagingSearch)}" oninput="packagingSearch=this.value;render();keepFocus()">
    <button class="btn" onclick="newPackaging()">＋ 新增包裝／底卡</button></div>
  <div class="panel"><div class="tablewrap"><table><thead><tr><th>編號</th><th>名稱</th><th>固定檢查點</th><th>過去錯誤</th><th></th></tr></thead><tbody>`;
  const q = packagingSearch.trim().toLowerCase();
  const list = q ? packagings.filter(p=>[p.no,p.name].some(v=>(v||'').toLowerCase().includes(q))) : packagings;
  if(list.length===0) html += '<tr><td colspan="5"><div class="empty">找不到符合的包裝／底卡</div></td></tr>';
  list.forEach(p=>{
    html += `<tr onclick="nav('packaging-detail',{id:'${p.id}',tab:'info'})">
      <td>${esc(p.no)}</td><td>${esc(p.name)}</td><td>${p.checkpoints.length} 項</td><td>${packagingErrorCount(p.id)} 筆</td>
      <td style="text-align:right"><button type="button" class="btn small secondary" onclick="event.stopPropagation();deletePackaging('${p.id}')">刪除</button></td></tr>`;
  });
  html += '</tbody></table></div></div>'; return html;
}
function newPackaging(){
  openForm('新增包裝／底卡', [{key:'name', label:'包裝／底卡名稱', required:true}], (v)=>{
    const id = 'pk'+(seq++);
    packagings.push({id, no:'K'+String(packagings.length+1).padStart(3,'0'), name:v.name, checkpoints:[]});
    nav('packagings');
  }, '新增');
}
function viewPackagingDetail(id, tab){
  const p = packagings.find(x=>x.id===id); if(!p) return '<div class="empty">找不到這個包裝／底卡</div>';
  let html = `<div class="tabs">
    <div class="tab ${tab==='info'?'active':''}" onclick="nav('packaging-detail',{id:'${id}',tab:'info'})">基本資料</div>
    <div class="tab ${tab==='checkpoints'?'active':''}" onclick="nav('packaging-detail',{id:'${id}',tab:'checkpoints'})">固定檢查點</div>
    <div class="tab ${tab==='errors'?'active':''}" onclick="nav('packaging-detail',{id:'${id}',tab:'errors'})">錯誤紀錄</div>
  </div>`;
  if(tab==='checkpoints'){
    html += '<div class="panel detail-block">';
    if(p.checkpoints.length===0) html += '<div class="empty">尚未新增</div>';
    p.checkpoints.forEach(it=> html += `<div class="check-item">${reqTag(it.required)}<span>${esc(it.text)}</span>
      <button class="btn small secondary" style="margin-left:auto" onclick="editPackagingCheckpoint('${id}','${it.id}')">編輯</button>
      <button class="btn small secondary" onclick="deletePackagingCheckpoint('${id}','${it.id}')">刪除</button></div>`);
    html += `</div><div class="field-grid two" style="margin-top:14px">
      <div class="field"><label>新增檢查點</label><input type="text" id="newPkText2" placeholder="例如：確認貼合角度"></div>
    </div><div style="margin-top:10px;display:flex;align-items:center;gap:10px">
      <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub)"><input type="checkbox" id="newPkRequired2" checked style="width:15px;height:15px"> 必須確認</label>
      <button class="btn small" onclick="addPackagingCheckpointCatalog('${id}')">新增</button>
    </div>`;
  } else if(tab==='errors'){
    const hist = packagingErrors(id);
    if(hist.length===0) html += '<div class="panel"><div class="empty">目前沒有錯誤紀錄</div></div>';
    else { html += '<div class="panel">'; hist.forEach(e=> html += `<div class="err-item"><div class="d">${formatDate(e.date)}</div>${esc(e.content)}${e.fix?'<br>對策：'+esc(e.fix):''}</div>`); html += '</div>'; }
  } else {
    html += `<div class="panel detail-block">
      <div class="detail-row"><div class="k">編號</div><div>${esc(p.no)}</div></div>
      <div class="detail-row"><div class="k">名稱</div><div>${esc(p.name)}</div></div>
      <div class="detail-row"><div class="k">固定檢查點數</div><div>${p.checkpoints.length}</div></div>
      <div class="detail-row"><div class="k">過去錯誤次數</div><div>${packagingErrorCount(p.id)}</div></div>
    </div>
    <div style="margin-top:14px;display:flex;gap:10px">
      <button class="btn small secondary" onclick="editPackaging('${id}')">編輯名稱</button>
      <button class="btn small secondary" onclick="deletePackaging('${id}')">刪除此包裝／底卡</button>
    </div>`;
  }
  return html;
}
function editPackaging(id){
  const p = packagings.find(x=>x.id===id); if(!p) return;
  openForm('編輯包裝／底卡', [{key:'name', label:'包裝／底卡名稱', required:true, value:p.name}], (v)=>{
    p.name = v.name; render();
  }, '儲存');
}
function deletePackaging(id){
  const p = packagings.find(x=>x.id===id); if(!p) return;
  const usedCount = allStyleEntries().filter(e=>e.style.packagingId===id).length;
  const msg = usedCount>0
    ? ('確定刪除「'+p.name+'」嗎？目前有 '+usedCount+' 個款式使用這個包裝／底卡，刪除後這些款式會變成「尚未選擇包裝／底卡」，需要重新選擇。')
    : ('確定刪除「'+p.name+'」嗎？此動作無法復原。');
  if(!confirm(msg)) return;
  allStyleEntries().forEach(e=>{ if(e.style.packagingId===id){ e.style.packagingId=null; e.style.packagingCheck=null; } });
  packagings = packagings.filter(x=>x.id!==id);
  nav('packagings');
}
function addPackagingCheckpointCatalog(pid){
  const text=(document.getElementById('newPkText2').value||'').trim(); if(!text) return;
  const required=document.getElementById('newPkRequired2').checked;
  packagings.find(p=>p.id===pid).checkpoints.push({id:'k'+(seq++), text, required});
  render();
}
function editPackagingCheckpoint(pid,cid){
  const p=packagings.find(x=>x.id===pid); const it=p && p.checkpoints.find(c=>c.id===cid); if(!it) return;
  openForm('編輯固定檢查點', [{key:'text', label:'檢查內容', required:true, value:it.text}], (v)=>{ it.text=v.text; render(); }, '儲存');
}
function deletePackagingCheckpoint(pid,cid){ if(!confirm('確定刪除？')) return; const p=packagings.find(x=>x.id===pid); p.checkpoints=p.checkpoints.filter(c=>c.id!==cid); render(); }

/* ================= 錯誤紀錄（全部） ================= */
function viewErrors(){
  let html = `<div class="toolbar"><div></div><button class="btn" onclick="newErrorGeneral()">＋ 新增錯誤紀錄</button></div>`;
  if(errors.length===0) html += '<div class="panel"><div class="empty">目前沒有錯誤紀錄</div></div>';
  else {
    html += '<div class="panel"><div class="tablewrap"><table><thead><tr><th>日期</th><th>對象</th><th>名稱</th><th>階段</th><th>問題內容</th><th>對策</th><th></th></tr></thead><tbody>';
    errors.slice().reverse().forEach(e=>{
      const target = e.kind==='product' ? catalogOfId(e.refId) : pkgOfId(e.refId);
      html += `<tr><td>${formatDate(e.date)}</td><td>${e.kind==='product'?'商品':'包裝'}</td><td>${target?esc(target.name):'-'}</td><td>${esc(kindLabel(e.stage||'')||'-')}</td><td>${esc(e.content)}</td><td>${esc(e.fix||'-')}</td>
        <td><button class="btn small secondary" onclick="event.stopPropagation();editErrorEntry('${e.id}')">編輯</button>
        <button class="btn small secondary" onclick="event.stopPropagation();deleteErrorEntry('${e.id}')">刪除</button></td></tr>`;
    });
    html += '</tbody></table></div></div>';
  }
  return html;
}
/* ================= 出貨 ================= */
function viewShipping(){
  const allEntries = allStyleEntries();
  const unshipped = allEntries.filter(e=>!e.style.shipped);
  const shipped = allEntries.filter(e=>e.style.shipped)
    .slice().sort((a,b)=> (b.style.shippedDate||'').localeCompare(a.style.shippedDate||''));
  let html = `<div class="dash-section"><div class="sec-title">尚未出貨 <span class="count">${unshipped.length} 件</span></div>`;
  if(unshipped.length===0) html += '<div class="panel"><div class="empty">目前沒有尚未出貨的款式</div></div>';
  else {
    html += '<div class="panel"><div class="tablewrap"><table><thead><tr><th>案件編號</th><th>客戶</th><th>商品／款式</th><th>交期</th><th></th></tr></thead><tbody>';
    unshipped.forEach(e=>{
      html += `<tr onclick="nav('style-detail',{oid:'${e.order.id}',cpid:'${e.cp.id}',sid:'${e.style.id}',tab:'info'})">
        <td>${esc(e.order.no)}</td><td>${esc(e.order.customerName||'-')}</td><td>${esc(e.cp.name)}｜${esc(e.style.name)}</td><td>${formatDueDate(dueOf(e.style,e.order))}</td>
        <td><button class="btn small" onclick="event.stopPropagation();markShipped('${e.order.id}','${e.cp.id}','${e.style.id}')">標記已出貨</button></td></tr>`;
    });
    html += '</tbody></table></div></div></div>';
  }
  html += `<div class="dash-section"><div class="sec-title">已出貨 <span class="count">${shipped.length} 件</span></div>`;
  if(shipped.length===0) html += '<div class="panel"><div class="empty">目前沒有已出貨的款式</div></div>';
  else {
    html += '<div class="panel"><div class="tablewrap"><table><thead><tr><th>出貨日期</th><th>案件編號</th><th>客戶</th><th>商品／款式</th><th></th></tr></thead><tbody>';
    shipped.forEach(e=>{
      html += `<tr onclick="nav('style-detail',{oid:'${e.order.id}',cpid:'${e.cp.id}',sid:'${e.style.id}',tab:'info'})">
        <td>${formatDate(e.style.shippedDate)}</td><td>${esc(e.order.no)}</td><td>${esc(e.order.customerName||'-')}</td><td>${esc(e.cp.name)}｜${esc(e.style.name)}</td>
        <td><button class="btn small secondary" onclick="event.stopPropagation();unmarkShipped('${e.order.id}','${e.cp.id}','${e.style.id}')">取消標記</button></td></tr>`;
    });
    html += '</tbody></table></div></div></div>';
  }
  return html;
}
function newErrorGeneral(){
  const productOptions = products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  const packagingOptions = packagings.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  const stageOptions = KINDS.map(k=>`<option value="${k.key}">${k.label}</option>`).join('');
  const body = `<div class="field-grid">
    <div class="field"><label>這次的問題發生在</label>
      <select id="mf_kind" onchange="
        document.getElementById('mf_product_wrap').style.display=this.value==='product'?'block':'none';
        document.getElementById('mf_stage_wrap').style.display=this.value==='product'?'block':'none';
        document.getElementById('mf_packaging_wrap').style.display=this.value==='packaging'?'block':'none';">
        <option value="product">商品</option>
        <option value="packaging">包裝／底卡</option>
      </select>
    </div>
    <div class="field" id="mf_product_wrap"><label>商品</label><select id="mf_product">${productOptions||'<option value="">（尚未建立商品）</option>'}</select></div>
    <div class="field" id="mf_stage_wrap"><label>發生在哪個階段</label><select id="mf_stage">${stageOptions}</select></div>
    <div class="field" id="mf_packaging_wrap" style="display:none"><label>包裝／底卡</label><select id="mf_packaging">${packagingOptions||'<option value="">（尚未建立包裝／底卡）</option>'}</select></div>
    <div class="field"><label>問題內容 <span style="color:var(--danger)">*</span></label><textarea id="mf_content" rows="2"></textarea></div>
    <div class="field"><label>之後要怎麼避免？（會用來當作固定提醒的文字）</label><textarea id="mf_fix" rows="2"></textarea></div>
  </div>`;
  openModalRaw('新增錯誤紀錄', body, '新增', ()=>{
    const kind = document.getElementById('mf_kind').value;
    const content = (document.getElementById('mf_content').value||'').trim();
    if(!content){ alert('請輸入問題內容'); return; }
    const fix = (document.getElementById('mf_fix').value||'').trim() || ('確認：'+content);
    if(kind==='product'){
      if(products.length===0){ alert('請先建立商品'); return; }
      const p = products.find(x=>x.id===document.getElementById('mf_product').value); if(!p) return;
      const stage = document.getElementById('mf_stage').value;
      errors.push({id:'e'+(seq++), date:todayStr(), kind:'product', refId:p.id, stage, content, fix});
      if(confirm('要加入商品固定提醒嗎？')) p.checkpoints.push({id:'c'+(seq++), stage:stage||'all', text:fix, required:true});
    } else {
      if(packagings.length===0){ alert('請先建立包裝／底卡'); return; }
      const p = packagings.find(x=>x.id===document.getElementById('mf_packaging').value); if(!p) return;
      errors.push({id:'e'+(seq++), date:todayStr(), kind:'packaging', refId:p.id, stage:'', content, fix});
      if(confirm('要加入包裝固定提醒嗎？')) p.checkpoints.push({id:'k'+(seq++), text:fix, required:true});
    }
    closeModal();
    nav('errors');
  });
}
function deleteErrorEntry(id){ if(!confirm('確定刪除這筆錯誤紀錄？')) return; errors = errors.filter(e=>e.id!==id); render(); }
function editErrorEntry(id){
  const e = errors.find(x=>x.id===id); if(!e) return;
  openForm('編輯錯誤紀錄', [
    {key:'content', label:'問題內容', type:'textarea', required:true, value:e.content},
    {key:'fix', label:'對策', type:'textarea', value:e.fix}
  ], (v)=>{ e.content=v.content; e.fix=v.fix; render(); }, '儲存');
}

/* ================= 規劃中頁面 ================= */
function viewSoon(title){
  const desc = {
    '統計':'未來會提供依商品、時間區間的統計報表。',
    '系統設定':'未來會放製作方式清單維護等系統層級設定。'
  };
  return `<div class="soon-box"><b>${esc(title)}</b> 規劃中，尚未開放<br>${esc(desc[title]||'')}</div>`;
}

initApp();
